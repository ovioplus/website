<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>OvioPlus · Sabato sera</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=block" rel="stylesheet" />
<style>
  :root { --ink:#0f172a; --cyan:#2cabe6; --cyan2:#5cc4f0; --cyanD:#1a8ac0; --muted:#64748b; --rose:#e11d48; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #e4eefb; }
  body { font-family: Outfit, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: radial-gradient(1200px 700px at 15% 10%, #eef6ff 0%, transparent 60%), radial-gradient(900px 600px at 90% 90%, #dbeafc 0%, transparent 60%), linear-gradient(180deg, #e3eefc 0%, #d7e7fa 100%); }
  .scene { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }
  .abs { position: absolute; }
  em { font-style: italic; color: var(--cyan); }
  .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* caption */
  #caption { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 74px; line-height: 1.05; letter-spacing: -0.01em; color: var(--ink); }
  #caption .sub { display: block; margin-top: 14px; font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cyanD); font-weight: 500; }
  .capline { position: absolute; left: 0; right: 0; bottom: 0; opacity: 0; }

  /* missed call pills */
  .pill { position: absolute; display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-radius: 999px; background: #fff; box-shadow: 0 16px 40px -14px rgba(15,23,42,.35); font-size: 24px; font-weight: 600; white-space: nowrap; }
  .pill .dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; }

  /* cards */
  .card { background: #fff; border-radius: 28px; box-shadow: 0 30px 80px -30px rgba(15,23,42,.35); border: 1px solid rgba(255,255,255,.9); }
  .browser { position: absolute; left: 170px; top: 46px; width: 1580px; height: 836px; border-radius: 26px; overflow: hidden; background: #fff; box-shadow: 0 40px 100px -40px rgba(15,23,42,.45); }
  .bar { height: 54px; display: flex; align-items: center; gap: 11px; padding: 0 22px; background: #f6f8fb; border-bottom: 1px solid #edf1f6; }
  .bar i { width: 15px; height: 15px; border-radius: 50%; display: block; }
  .url { margin-left: 18px; padding: 7px 18px; border-radius: 9px; background: #fff; box-shadow: inset 0 0 0 1px #e2e8f0; font-family: 'JetBrains Mono', monospace; font-size: 17px; color: #94a3b8; }
  .chip { display: inline-flex; align-items: center; border-radius: 999px; padding: 8px 18px; font-size: 20px; font-weight: 500; }
  .row { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid #f1f5f9; }
  .status { margin-left: auto; border-radius: 999px; padding: 4px 12px; font-size: 15px; font-weight: 600; white-space: nowrap; }
  .bubble { position: absolute; max-width: 760px; padding: 22px 28px; border-radius: 30px; font-size: 32px; line-height: 1.3; box-shadow: 0 18px 40px -18px rgba(15,23,42,.3); }
  .stat { flex: 1; border-radius: 18px; background: #f8fafc; padding: 16px 20px; }
  .stat b { display: block; margin-top: 6px; font-family: Outfit, sans-serif; font-size: 52px; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 16px; letter-spacing: .14em; text-transform: uppercase; color: #94a3b8; font-weight: 600; }
</style>
</head>
<body>
<div id="stage">
  <!-- A / F: the restaurant -->
  <div class="scene" id="sRoom">
    <svg id="room" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
    <div id="pills"></div>
    <div class="pill abs" id="missedCount" style="left:1500px;top:140px;background:#fff1f2;color:#be123c;opacity:0"></div>
    <div class="pill abs" id="calmBadge" style="left:1330px;top:330px;opacity:0"><span class="dot" style="background:#e0f2fe;color:#0369a1">✦</span><span id="calmText"></span></div>
    <div class="pill abs" id="zeroBadge" style="left:1390px;top:420px;opacity:0;background:#ecfdf5;color:#047857"><span class="dot" style="background:#d1fae5">✓</span><span id="zeroText"></span></div>
  </div>

  <!-- B: the wipe -->
  <div class="scene" id="sWipe">
    <div class="abs" id="wipeCircle" style="left:0;top:0;width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#5cc4f0,#2cabe6)"></div>
    <div class="abs" id="wipeTitle" style="left:0;right:0;top:420px;text-align:center;color:#fff">
      <img src="icon.png" style="width:120px;height:120px;border-radius:28px;box-shadow:0 20px 50px -20px rgba(0,0,0,.4)" />
      <div class="serif" id="wipeText" style="margin-top:34px;font-size:96px;font-weight:600;line-height:1"></div>
    </div>
  </div>

  <!-- C: the AI call -->
  <div class="scene" id="sCall">
    <div class="abs" style="left:200px;top:90px;width:410px;height:740px;border-radius:62px;background:#0f172a;padding:14px;box-shadow:0 40px 100px -40px rgba(15,23,42,.6)">
      <div style="position:relative;width:100%;height:100%;border-radius:52px;overflow:hidden;background:linear-gradient(180deg,#0b2236 0%,#0f172a 100%);color:#fff;text-align:center">
        <div style="position:absolute;left:50%;top:14px;width:120px;height:32px;border-radius:20px;background:#000;transform:translateX(-50%)"></div>
        <div id="ring" style="position:absolute;left:50%;top:150px;width:170px;height:170px;margin-left:-85px;border-radius:50%;background:rgba(44,171,230,.18)"></div>
        <img src="icon.png" style="position:absolute;left:50%;top:180px;width:110px;height:110px;margin-left:-55px;border-radius:30px" />
        <div style="position:absolute;left:0;right:0;top:350px;font-size:34px;font-weight:600">OvioPlus AI</div>
        <div id="callTimer" class="mono" style="position:absolute;left:0;right:0;top:400px;font-size:22px;color:#7dd3fc"></div>
        <div id="wave" style="position:absolute;left:55px;right:55px;top:455px;height:100px;display:flex;align-items:center;justify-content:space-between"></div>
        <div style="position:absolute;left:50%;bottom:60px;width:96px;height:96px;margin-left:-48px;border-radius:50%;background:#e11d48;display:grid;place-items:center;font-size:40px">✆</div>
      </div>
    </div>
    <div id="bubbles"></div>
    <div class="card abs" id="confirmCard" style="left:760px;top:640px;width:900px;padding:30px 36px;display:flex;align-items:center;gap:26px;opacity:0">
      <div style="width:76px;height:76px;border-radius:50%;background:#d1fae5;color:#047857;display:grid;place-items:center;font-size:40px;font-weight:700">✓</div>
      <div><div id="cardTitle" style="font-size:34px;font-weight:700"></div><div id="cardBody" style="margin-top:6px;font-size:26px;color:#475569"></div></div>
    </div>
  </div>

  <!-- D: the dashboard -->
  <div class="scene" id="sDash">
    <div class="browser">
      <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span class="url">app.ovioplus.ai/dashboard/service</span></div>
      <div style="position:relative;height:782px;background:#f7f9fc;padding:22px 30px">
        <div style="display:flex;align-items:center;gap:14px">
          <span class="serif" id="dTitle" style="font-size:44px;font-weight:600"></span>
          <span class="chip" id="dDate" style="background:#fff;box-shadow:0 0 0 1px #e2e8f0"></span>
          <span class="chip" id="dToday" style="background:#0f172a;color:#fff"></span>
          <span style="margin-left:auto;display:inline-flex;border-radius:999px;background:#fff;box-shadow:0 0 0 1px #e2e8f0;padding:4px;font-size:18px;font-weight:500"><span id="dMap" style="background:#0f172a;color:#fff;border-radius:999px;padding:6px 20px"></span><span style="padding:6px 20px;color:#64748b">Timeline</span></span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 440px;gap:26px;margin-top:22px">
          <div>
            <div style="background:#fff;border-radius:18px;box-shadow:0 0 0 1px #eef2f7;padding:14px 20px;display:flex;align-items:center;gap:18px">
              <span id="dAt" style="font-size:20px;color:#64748b"></span>
              <div style="flex:1;height:10px;border-radius:9px;background:#eef2f7;position:relative"><div id="dSlide" style="position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:#2cabe6"></div><div id="dKnob" style="position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#2cabe6;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2)"></div></div>
              <span id="dNow" style="border-radius:999px;background:#fff1f2;color:#e11d48;padding:4px 14px;font-weight:600;font-size:17px"></span>
            </div>
            <div style="margin-top:16px;border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px #e9dfcc;background:#f3ead9">
              <svg id="map" viewBox="0 0 960 545" width="100%" height="585" preserveAspectRatio="xMidYMid meet" style="display:block"></svg>
            </div>
          </div>
          <div>
            <div id="dNew" style="border-radius:18px;background:#0f172a;color:#fff;text-align:center;padding:16px;font-size:20px;font-weight:600"></div>
            <div style="margin-top:14px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px #eef2f7;overflow:hidden">
              <div style="display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #f1f5f9;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#94a3b8;font-weight:600"><span id="dBookings"></span><span id="dCount"></span></div>
              <div id="dList"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card abs" id="flyCard" style="width:560px;padding:22px 26px;display:flex;align-items:center;gap:18px;opacity:0">
      <div style="width:56px;height:56px;border-radius:50%;background:#d1fae5;color:#047857;display:grid;place-items:center;font-size:30px;font-weight:700">✓</div>
      <div><div id="flyTitle" style="font-size:26px;font-weight:700"></div><div id="flyBody" style="font-size:20px;color:#475569"></div></div>
    </div>
    <div class="card abs" id="waCard" style="left:1290px;top:110px;width:520px;padding:22px 24px;opacity:0;border-radius:24px">
      <div style="display:flex;align-items:center;gap:12px;font-size:19px;font-weight:600;color:#15803d"><span style="width:38px;height:38px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;font-size:20px">✆</span>WhatsApp</div>
      <div id="waText" style="margin-top:12px;font-size:23px;line-height:1.35;color:#334155"></div>
    </div>
    <div class="pill abs" id="savedToast" style="left:230px;top:850px;opacity:0;background:#ecfdf5;color:#047857"><span class="dot" style="background:#d1fae5">✓</span><span id="savedText"></span></div>
    <div class="pill abs" id="noDouble" style="left:1300px;top:842px;opacity:0;font-size:28px;padding:18px 28px"><span class="dot" style="background:#e0f2fe;color:#0369a1;width:44px;height:44px;font-size:22px">⛨</span><span id="noDoubleText"></span></div>
    <svg id="cursor" class="abs" width="44" height="56" viewBox="0 0 22 28" style="opacity:0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))"><path d="M2 2 L2 22 L7.5 17 L11 25 L14.5 23.5 L11 15.8 L18 15.8 Z" fill="#0f172a" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <div id="clickRing" class="abs" style="width:70px;height:70px;border-radius:50%;border:4px solid #2cabe6;opacity:0"></div>
  </div>

  <!-- E: ask Ovio -->
  <div class="scene" id="sAsk">
    <div class="abs" style="left:380px;top:150px;width:1160px">
      <div class="card" style="display:flex;align-items:center;gap:18px;padding:26px 34px;border-radius:999px;font-size:32px">
        <span style="color:#2cabe6;font-size:34px">✦</span><span id="askTyped" style="color:#0f172a"></span><span id="caret" style="width:3px;height:38px;background:#2cabe6"></span>
        <span class="mono" style="margin-left:auto;font-size:18px;color:#94a3b8;background:#f1f5f9;border-radius:999px;padding:6px 14px">7/10</span>
      </div>
      <div id="askQ" style="margin:34px 0 0 auto;width:fit-content;background:#0f172a;color:#fff;border-radius:28px 28px 8px 28px;padding:18px 28px;font-size:30px;opacity:0"></div>
      <div id="thinking" style="margin-top:26px;font-size:40px;color:#94a3b8;letter-spacing:6px;opacity:0">•••</div>
      <div class="card" id="askA" style="margin-top:-30px;padding:34px 38px;opacity:0">
        <div id="askAText" style="font-size:30px;line-height:1.4;color:#334155"></div>
        <div style="display:flex;gap:16px;margin-top:24px">
          <div class="stat"><span id="s1l"></span><b id="s1">0</b></div>
          <div class="stat"><span id="s2l"></span><b id="s2">0</b></div>
          <div class="stat"><span id="s3l"></span><b id="s3">0</b></div>
        </div>
      </div>
    </div>
  </div>

  <!-- G: end card -->
  <div class="scene" id="sEnd">
    <div class="abs" style="left:0;right:0;top:300px;text-align:center">
      <div style="display:inline-flex;align-items:center;gap:26px">
        <img src="icon.png" style="width:118px;height:118px;border-radius:30px;box-shadow:0 20px 50px -24px rgba(15,23,42,.5)" />
        <span class="serif" style="font-size:110px;font-weight:600;letter-spacing:.01em">Ovio<span style="color:#2cabe6">Plus</span></span>
      </div>
      <div class="serif" id="endTag" style="margin-top:40px;font-size:78px;font-weight:600;line-height:1.05"></div>
      <div id="endCta" style="display:inline-block;margin-top:56px;padding:26px 56px;border-radius:999px;background:linear-gradient(135deg,#5cc4f0,#2cabe6);color:#fff;font-size:36px;font-weight:600;box-shadow:0 20px 50px -16px rgba(44,171,230,.6)"></div>
      <div class="mono" style="margin-top:34px;font-size:30px;color:#475569;letter-spacing:.06em">ovioplus.ai</div>
    </div>
  </div>

  <div id="caption"></div>
</div>

<script>
const LANG = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'it'
const S = {
  it: {
    c1: 'Sabato, 20:30. <em>Sala piena.</em>',
    c2: 'Il telefono squilla. <em>Nessuno può rispondere.</em>',
    missed: 'Chiamata persa', missedN: (n) => `${n} ${n === 1 ? 'chiamata persa' : 'chiamate perse'}`,
    wipe: 'Da stasera risponde <em style="color:#fff">OvioPlus</em>.',
    calling: 'In chiamata',
    g1: 'Buonasera, avete un tavolo per 4 stasera alle 21?',
    a1: 'Buonasera! Sì, alle 21:00 ho libero il tavolo 7. A che nome?',
    g2: 'Rossi.',
    a2: 'Perfetto, signor Rossi. La aspettiamo alle 21!',
    cardTitle: 'Prenotazione confermata', cardBody: 'Rossi · 4 ospiti · 21:00 · Tavolo 7',
    c4: 'L’AI risponde, <em>prenota e conferma.</em><span class="sub">24 ore su 24 · italiano e inglese</span>',
    c5: 'Ogni prenotazione arriva <em>nella tua sala.</em>',
    c6: 'Telefono, chat, WhatsApp: <em>un solo calendario.</em>',
    dTitle: 'Servizio', dDate: '📅 sabato 14 novembre ▾', dToday: 'Oggi', dMap: 'Mappa', dAt: 'Alle', dNow: '● Adesso', dNew: '+ Nuova prenotazione', dBookings: 'Prenotazioni',
    seated: 'Al tavolo', confirmed: 'Confermata', pending: 'In attesa', covers: 'coperti', noTable: 'senza tavolo', viaPhone: 'telefono AI', viaWa: 'via WhatsApp',
    wa: '“Ciao! Avete un tavolo per 2 alle 21:30? Bianchi”',
    saved: 'Prenotazione salvata · via WhatsApp', noDouble: 'Zero doppie prenotazioni',
    legend: ['Al tavolo', 'In arrivo', 'Libero'],
    c7: 'Hai una domanda? <em>Chiedi a Ovio.</em>',
    ask: 'Chi arriva stasera?',
    answer: 'Stasera 18 prenotazioni e 64 coperti. Attenzione: allergia alle noci al T3 e un compleanno al T7.',
    s: ['Prenotazioni', 'Coperti', 'Richieste'],
    c8: 'Tu pensi alla cucina. <em>Al telefono pensiamo noi.</em>',
    calm: 'OvioPlus ha risposto a 12 chiamate', zero: '0 chiamate perse',
    endTag: 'Il tuo receptionist AI. <em>Sempre acceso.</em>', cta: 'Provalo gratis per 14 giorni',
    sign: 'Trattoria da Marco',
  },
  en: {
    c1: 'Saturday, 8:30 pm. <em>Full house.</em>',
    c2: 'The phone rings. <em>Nobody can answer.</em>',
    missed: 'Missed call', missedN: (n) => `${n} missed ${n === 1 ? 'call' : 'calls'}`,
    wipe: 'From tonight, <em style="color:#fff">OvioPlus</em> answers.',
    calling: 'On a call',
    g1: 'Good evening, do you have a table for 4 tonight at 9?',
    a1: 'Good evening! Yes, table 7 is free at 9 pm. What name is it under?',
    g2: 'Rossi.',
    a2: 'Perfect, Mr Rossi. See you at 9!',
    cardTitle: 'Booking confirmed', cardBody: 'Rossi · 4 guests · 21:00 · Table 7',
    c4: 'The AI answers, <em>books and confirms.</em><span class="sub">24/7 · Italian and English</span>',
    c5: 'Every booking lands <em>in your room.</em>',
    c6: 'Phone, chat, WhatsApp: <em>one calendar.</em>',
    dTitle: 'Service', dDate: '📅 Saturday 14 November ▾', dToday: 'Today', dMap: 'Map', dAt: 'At', dNow: '● Now', dNew: '+ New booking', dBookings: 'Bookings',
    seated: 'Seated', confirmed: 'Confirmed', pending: 'Pending', covers: 'covers', noTable: 'no table', viaPhone: 'AI phone', viaWa: 'via WhatsApp',
    wa: '“Hi! Do you have a table for 2 at 9:30? Bianchi”',
    saved: 'Booking saved · via WhatsApp', noDouble: 'Zero double bookings',
    legend: ['Seated', 'Arriving', 'Free'],
    c7: 'Got a question? <em>Ask Ovio.</em>',
    ask: 'Who is coming tonight?',
    answer: 'Tonight: 18 bookings and 64 covers. Heads up: a nut allergy at T3 and a birthday at T7.',
    s: ['Bookings', 'Covers', 'Requests'],
    c8: 'You run the kitchen. <em>We answer the phone.</em>',
    calm: 'OvioPlus answered 12 calls', zero: '0 missed calls',
    endTag: 'Your AI receptionist. <em>Always on.</em>', cta: 'Try it free for 14 days',
    sign: 'Trattoria da Marco',
  },
}[LANG]

// ---------------------------------------------------------------- helpers
const $ = (id) => document.getElementById(id)
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const prog = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2)
const back = (x) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) }
/** 0 → 1 → 0 over [a, b] with `d`-second fades. */
const win = (t, a, b, d = 0.45) => Math.min(eo(prog(t, a, a + d)), 1 - eio(prog(t, b - d, b)))
const lerp = (a, b, x) => a + (b - a) * x
const set = (el, o, tr) => { el.style.opacity = o; if (tr !== undefined) el.style.transform = tr }

// static text
$('wipeText').innerHTML = S.wipe
$('cardTitle').textContent = S.cardTitle; $('cardBody').textContent = S.cardBody
$('flyTitle').textContent = S.cardTitle; $('flyBody').textContent = S.cardBody
for (const k of ['dTitle', 'dDate', 'dToday', 'dMap', 'dNow', 'dNew', 'dBookings']) $(k).textContent = S[k]
$('waText').textContent = S.wa; $('savedText').textContent = S.saved; $('noDoubleText').textContent = S.noDouble
$('s1l').textContent = S.s[0]; $('s2l').textContent = S.s[1]; $('s3l').textContent = S.s[2]
$('calmText').textContent = S.calm; $('zeroText').textContent = S.zero
$('endTag').innerHTML = S.endTag; $('endCta').textContent = S.cta
for (let i = 0; i < 26; i++) { const b = document.createElement('i'); b.style.cssText = 'display:block;width:7px;border-radius:4px;background:#7dd3fc'; $('wave').appendChild(b) }

// ---------------------------------------------------------------- captions
const CAPS = [
  [0.4, 5.6, S.c1], [5.6, 10.6, S.c2], [13.6, 21.2, S.c4], [21.8, 25.6, S.c5], [25.6, 30.3, S.c6], [30.8, 35.4, S.c7], [35.8, 38.6, S.c8],
]
$('caption').innerHTML = CAPS.map((c, i) => `<div class="capline" id="cap${i}">${c[2]}</div>`).join('')

// ---------------------------------------------------------------- stick figures
const STROKE = '#0f172a'
function face(x, y, r, dir, mood) {
  const ex = dir * r * 0.28
  let s = `<circle cx="${x + ex - r * 0.28}" cy="${y - r * 0.1}" r="${r * 0.11}" fill="${STROKE}"/><circle cx="${x + ex + r * 0.28}" cy="${y - r * 0.1}" r="${r * 0.11}" fill="${STROKE}"/>`
  if (mood === 'happy') s += `<path d="M${x + ex - r * 0.36} ${y + r * 0.22} Q${x + ex} ${y + r * 0.62} ${x + ex + r * 0.36} ${y + r * 0.22}" fill="none" stroke="${STROKE}" stroke-width="${r * 0.12}" stroke-linecap="round"/>`
  else if (mood === 'stress') s += `<path d="M${x + ex - r * 0.3} ${y + r * 0.42} Q${x + ex} ${y + r * 0.22} ${x + ex + r * 0.3} ${y + r * 0.42}" fill="none" stroke="${STROKE}" stroke-width="${r * 0.12}" stroke-linecap="round"/>`
  else s += `<line x1="${x + ex - r * 0.25}" y1="${y + r * 0.35}" x2="${x + ex + r * 0.25}" y2="${y + r * 0.35}" stroke="${STROKE}" stroke-width="${r * 0.12}" stroke-linecap="round"/>`
  return s
}
const L = (x1, y1, x2, y2, w = 8, c = STROKE) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`

/** Marco: chef hat, apron, tray. `phase` drives the walk; `serve` reaches the tray to a table. */
function marco({ x, floor, phase, walking, dir, mood, serve = 0, look = 0 }) {
  const hip = floor - 150, sh = hip - 125, head = sh - 52, r = 40
  const sw = walking ? Math.sin(phase) * 0.55 : 0
  const bob = walking ? Math.abs(Math.cos(phase)) * 6 : 0
  const y = (v) => v - bob
  const leg = (a) => [x + Math.sin(a) * 150, y(hip) + Math.cos(a) * 150]
  const [l1x, l1y] = leg(sw), [l2x, l2y] = leg(-sw)
  let s = ''
  s += L(x, y(hip), l1x, l1y) + L(x, y(hip), l2x, l2y)
  // apron
  s += `<path d="M${x - 34} ${y(sh + 34)} L${x + 34} ${y(sh + 34)} L${x + 44} ${y(hip + 40)} L${x - 44} ${y(hip + 40)} Z" fill="#fff" stroke="${STROKE}" stroke-width="5" stroke-linejoin="round"/>`
  s += L(x, y(sh), x, y(hip))
  // arms: back arm swings, front arm holds the tray up (or reaches out to serve)
  const ba = walking ? -sw * 0.8 : 0.25
  s += L(x, y(sh + 10), x - dir * 30 + Math.sin(ba) * 70, y(sh + 10) + Math.cos(ba) * 95)
  const reach = serve
  // serving: the tray comes down onto the table in front of him
  const hx = x + dir * lerp(46, 150, reach), hy = y(lerp(sh - 70, floor - 182, reach))
  const ex = lerp(x + dir * 70, x + dir * 80, reach), ey = lerp(y(sh - 10), y(sh + 70), reach)
  s += L(x, y(sh + 10), ex, ey) + L(ex, ey, hx, hy)
  // tray + plates
  s += `<g><line x1="${hx - 70}" y1="${hy}" x2="${hx + 70}" y2="${hy}" stroke="${STROKE}" stroke-width="7" stroke-linecap="round"/>`
  s += `<path d="M${hx - 58} ${hy - 4} Q${hx - 30} ${hy - 30} ${hx - 2} ${hy - 4}" fill="#fff" stroke="${STROKE}" stroke-width="5"/><path d="M${hx + 6} ${hy - 4} Q${hx + 34} ${hy - 30} ${hx + 62} ${hy - 4}" fill="#fff" stroke="${STROKE}" stroke-width="5"/>`
  for (const k of [-30, 34]) s += `<path d="M${hx + k} ${hy - 36} q 6 -10 0 -20 q -6 -10 0 -20" fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" opacity="${0.5 + 0.5 * Math.sin(phase * 1.3 + k)}"/>`
  s += `</g>`
  // head + chef hat
  const hd = dir * (look ? -1 : 1)
  s += `<circle cx="${x}" cy="${y(head)}" r="${r}" fill="#fff" stroke="${STROKE}" stroke-width="7"/>` + face(x, y(head), r, hd, mood)
  s += `<path d="M${x - 34} ${y(head - 30)} L${x - 30} ${y(head - 62)} Q${x - 52} ${y(head - 92)} ${x - 22} ${y(head - 100)} Q${x} ${y(head - 128)} ${x + 22} ${y(head - 100)} Q${x + 52} ${y(head - 92)} ${x + 30} ${y(head - 62)} L${x + 34} ${y(head - 30)} Z" fill="#fff" stroke="${STROKE}" stroke-width="6" stroke-linejoin="round"/>`
  if (mood === 'stress') {
    s += `<path d="M${x + hd * 58} ${y(head - 26)} q 8 14 0 22 q -8 -8 0 -22" fill="#7dd3fc"/>`
    s += `<text x="${x - 30}" y="${y(head - 140)}" font-family="Outfit" font-weight="700" font-size="64" fill="#e11d48">!?</text>`
  }
  return s
}

/** A seated guest; `talk` nods the head. */
function guest(x, floor, dir, talk, mood = 'neutral') {
  const seat = floor - 120, sh = seat - 110, head = sh - 46, r = 34
  const nod = Math.sin(talk) * 3
  let s = ''
  s += `<path d="M${x - dir * 40} ${floor} L${x - dir * 40} ${seat} L${x + dir * 30} ${seat}" fill="none" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>` // chair
  s += L(x, sh, x, seat) + L(x, seat, x + dir * 70, seat) + L(x + dir * 70, seat, x + dir * 70, floor)
  s += L(x, sh + 12, x + dir * 50, sh + 50) + L(x + dir * 50, sh + 50, x + dir * 92, sh + 40 + Math.sin(talk * 0.7) * 6)
  s += `<circle cx="${x}" cy="${head + nod}" r="${r}" fill="#fff" stroke="${STROKE}" stroke-width="7"/>` + face(x, head + nod, r, dir, mood)
  return s
}

function table(x, floor) {
  const top = floor - 150
  let s = `<line x1="${x - 110}" y1="${top}" x2="${x + 110}" y2="${top}" stroke="${STROKE}" stroke-width="9" stroke-linecap="round"/>` + L(x, top, x, floor - 6) + L(x - 40, floor - 3, x + 40, floor - 3)
  s += `<path d="M${x - 70} ${top - 5} Q${x - 46} ${top - 22} ${x - 22} ${top - 5}" fill="#fff" stroke="${STROKE}" stroke-width="4"/><path d="M${x + 22} ${top - 5} Q${x + 46} ${top - 22} ${x + 70} ${top - 5}" fill="#fff" stroke="${STROKE}" stroke-width="4"/>`
  s += `<rect x="${x - 6}" y="${top - 46}" width="12" height="40" rx="3" fill="#fde68a" stroke="${STROKE}" stroke-width="3"/><path d="M${x} ${top - 62} q 7 9 0 16 q -7 -7 0 -16" fill="#f59e0b"/>`
  return s
}

function phone(x, y, shake, glow) {
  const a = Math.sin(shake * 60) * 9 * (shake > 0 ? 1 : 0)
  let s = ''
  if (glow) s += `<circle cx="${x}" cy="${y - 20}" r="${90 + Math.sin(glow * 4) * 6}" fill="#2cabe6" opacity="0.14"/>`
  s += `<g transform="rotate(${a} ${x} ${y})">`
  s += `<path d="M${x - 62} ${y} L${x - 46} ${y - 52} L${x + 46} ${y - 52} L${x + 62} ${y} Z" fill="${glow ? '#e0f2fe' : '#fff'}" stroke="${STROKE}" stroke-width="7" stroke-linejoin="round"/>`
  s += `<path d="M${x - 70} ${y - 64} Q${x} ${y - 98} ${x + 70} ${y - 64}" fill="none" stroke="${STROKE}" stroke-width="16" stroke-linecap="round"/>`
  s += `<circle cx="${x}" cy="${y - 26}" r="13" fill="none" stroke="${STROKE}" stroke-width="5"/></g>`
  if (shake > 0) {
    for (let i = 0; i < 3; i++) {
      const k = (shake * 2.2 + i / 3) % 1
      s += `<path d="M${x - 92 - k * 40} ${y - 100 - k * 30} q -22 40 0 80" fill="none" stroke="#e11d48" stroke-width="6" stroke-linecap="round" opacity="${1 - k}"/>`
      s += `<path d="M${x + 92 + k * 40} ${y - 100 - k * 30} q 22 40 0 80" fill="none" stroke="#e11d48" stroke-width="6" stroke-linecap="round" opacity="${1 - k}"/>`
    }
  }
  return s
}

function drawRoom(t, calm) {
  const floor = 820
  let s = ''
  // wall, windows, lamps, sign
  s += `<rect x="0" y="${floor}" width="1920" height="260" fill="#cfdff3"/><line x1="120" y1="${floor}" x2="1800" y2="${floor}" stroke="${STROKE}" stroke-width="6" stroke-linecap="round"/>`
  for (const wx of [210, 640, 1070]) s += `<path d="M${wx} 520 L${wx} 330 Q${wx + 90} 240 ${wx + 180} 330 L${wx + 180} 520 Z" fill="#f8fbff" stroke="#94a3b8" stroke-width="5"/><line x1="${wx + 90}" y1="290" x2="${wx + 90}" y2="520" stroke="#94a3b8" stroke-width="4"/>`
  for (const lx of [300, 1160]) s += `<line x1="${lx}" y1="0" x2="${lx}" y2="160" stroke="#94a3b8" stroke-width="4"/><path d="M${lx - 44} 200 Q${lx} 140 ${lx + 44} 200 Z" fill="#fff" stroke="${STROKE}" stroke-width="5"/><circle cx="${lx}" cy="212" r="60" fill="#fde68a" opacity="${calm ? 0.35 : 0.25}"/>`
  s += `<text x="730" y="120" text-anchor="middle" font-family="Cormorant Garamond" font-style="italic" font-weight="600" font-size="62" fill="${STROKE}">${S.sign}</text>`
  // counter
  s += `<rect x="1460" y="600" width="330" height="${floor - 600}" rx="10" fill="#fff" stroke="${STROKE}" stroke-width="7"/><line x1="1440" y1="600" x2="1810" y2="600" stroke="${STROKE}" stroke-width="10" stroke-linecap="round"/>`
  // tables + guests
  const tbl = [300, 730, 1160]
  tbl.forEach((x, i) => {
    s += guest(x - 145, floor, 1, t * 3 + i * 1.7, calm ? 'happy' : 'neutral')
    s += guest(x + 145, floor, -1, t * 3.4 + i * 2.3, calm ? 'happy' : 'neutral')
    s += table(x, floor)
  })
  // phone
  if (calm) s += phone(1625, 592, 0, t)
  else {
    const ringing = t > 2.4 && t < 10.6 ? ((t - 2.4) % 1.25 < 0.9 ? t : 0) : 0
    s += phone(1625, 592, ringing, 0)
  }
  // Marco
  if (calm) {
    s += marco({ x: 945, floor, phase: t * 6, walking: false, dir: -1, mood: 'happy', serve: clamp((t - 36.1) / 0.8) })
  } else {
    // aisle to aisle between the tables, then to the phone, stressed
    const keys = [[0, 600], [3, 1300], [6, 600], [8.4, 1385]]
    let x = 1385, dir = 1, walking = false
    for (let k = 0; k < keys.length - 1; k++) {
      const [ta, xa] = keys[k], [tb, xb] = keys[k + 1]
      if (t >= ta && t < tb) { x = lerp(xa, xb, eio((t - ta) / (tb - ta))); dir = xb > xa ? 1 : -1; walking = true }
    }
    s += marco({ x, floor, phase: t * 9, walking, dir, mood: t > 6.2 ? 'stress' : 'neutral' })
  }
  $('room').innerHTML = s
}

const SEAT = { fill: '#fdeecd', stroke: '#f59e0b', text: '#92400e' }
const SOON = { fill: '#eef8fd', stroke: '#2cabe6', text: '#0c4a6e' }
const FREE = { fill: '#f6ead3', stroke: '#c9a874', text: '#5b4426' }
function mapTable(tb, state, sub, halo) {
  const c = state === 'seated' ? SEAT : state === 'soon' ? SOON : FREE
  const cx = tb.x + tb.w / 2, cy = tb.y + tb.h / 2
  let s = `<g id="t-${tb.id}">`
  if (halo) s += `<rect x="${tb.x - 18}" y="${tb.y - 18}" width="${tb.w + 36}" height="${tb.h + 36}" rx="26" fill="#2cabe6" opacity="${0.15 + 0.15 * halo}"/>`
  if (tb.round) for (const a of [0, 90, 180, 270]) { const r = tb.w / 2 + 16, rad = (a * Math.PI) / 180; s += `<circle cx="${cx + r * Math.cos(rad)}" cy="${cy + r * Math.sin(rad)}" r="11" fill="#e7dccb"/>` }
  else for (const fx of [0.18, 0.6]) s += `<rect x="${tb.x + tb.w * fx}" y="${tb.y - 22}" width="${tb.w * 0.22}" height="14" rx="5" fill="#e7dccb"/><rect x="${tb.x + tb.w * fx}" y="${tb.y + tb.h + 8}" width="${tb.w * 0.22}" height="14" rx="5" fill="#e7dccb"/>`
  s += tb.round ? `<circle cx="${cx}" cy="${cy}" r="${tb.w / 2}" fill="${c.fill}" stroke="${c.stroke}" stroke-width="4"/>` : `<rect x="${tb.x}" y="${tb.y}" width="${tb.w}" height="${tb.h}" rx="18" fill="${c.fill}" stroke="${c.stroke}" stroke-width="4"/>`
  s += `<text x="${cx}" y="${sub ? cy - 4 : cy + 9}" text-anchor="middle" fill="${c.text}" font-family="Outfit" font-weight="700" font-size="28">${tb.id}</text>`
  if (sub) s += `<text x="${cx}" y="${cy + 26}" text-anchor="middle" fill="${c.text}" font-family="Outfit" font-weight="500" font-size="${tb.round ? 17 : 19}">${sub}</text>`
  return s + `</g>`
}

const BTOP = [130, 270, 440, 540]

function render(t) {

    set($('waCard'), t > 24.6 && t < 28.6 ? Math.min(clamp(wk), 1 - prog(t, 28.2, 28.6)) : 0, `translateY(${(1 - clamp(wk)) * -30}px)`)
    const t4 = $('t-T4')?.getBoundingClientRect()
    const cx = t4 ? t4.left + t4.width / 2 : 400, cy = t4 ? t4.top + t4.height / 2 : 500
    const mk = eio(prog(t, 25.4, 26.5))
    const cur = $('cursor')
    cur.style.left = `${lerp(1300, cx, mk)}px`
    cur.style.top = `${lerp(420, cy, mk)}px`
    set(cur, win(t, 25.3, 27.8, 0.3), `scale(${t > 26.55 && t < 26.8 ? 0.85 : 1})`)
    const rk = prog(t, 26.6, 27.2)
    const ring = $('clickRing')
    ring.style.left = `${cx - 35}px`
    ring.style.top = `${cy - 35}px`
    set(ring, t > 26.6 && t < 27.2 ? 1 - rk : 0, `scale(${1 + rk * 1.4})`)
    const sk = back(prog(t, 27.0, 27.4))
    set($('savedToast'), t > 27 && t < 29.4 ? Math.min(clamp(sk), 1 - prog(t, 29.0, 29.4)) : 0, `translateY(${(1 - clamp(sk)) * 20}px)`)
    const nk = back(prog(t, 28.3, 28.8))
    set($('noDouble'), t > 28.3 ? clamp(nk) : 0, `scale(${lerp(0.7, 1, nk)}) rotate(-2deg)`)
  }

  // ---- ask Ovio
  if (t > 30 && t < 36) {
    const typed = Math.floor(S.ask.length * prog(t, 31.0, 32.1))
    $('askTyped').textContent = S.ask.slice(0, typed)
    $('caret').style.opacity = t < 32.3 && Math.floor(t * 3) % 2 === 0 ? 1 : 0
    const qk = eo(prog(t, 32.3, 32.7))
    set($('askQ'), t > 32.3 ? qk : 0, `translateY(${(1 - qk) * 16}px)`)
    $('askQ').textContent = S.ask
    set($('thinking'), t > 32.7 && t < 33.4 ? 0.4 + 0.6 * Math.abs(Math.sin(t * 6)) : 0)
    const ak = eo(prog(t, 33.4, 33.9))
    set($('askA'), t > 33.4 ? ak : 0, `translateY(${(1 - ak) * 24}px)`)
    $('askAText').textContent = S.answer
    const ck = eo(prog(t, 33.6, 34.6))
    $('s1').textContent = Math.round(18 * ck)
    $('s2').textContent = Math.round(64 * ck)
    $('s3').textContent = Math.round(2 * ck)
  }
}
window.render = render
window.DURATION = DURATION
render(0)
</script>
</body>
</html>
